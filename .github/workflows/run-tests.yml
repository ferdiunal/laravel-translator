name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            php: '8.2'
            laravel: '10.*'
            testbench: '8.*'
            pest: '^2.34'
            pest_laravel: '^2.3'
            pest_arch: '^2.7'
            stability: prefer-lowest
          - os: ubuntu-latest
            php: '8.2'
            laravel: '10.*'
            testbench: '8.*'
            pest: '^2.34'
            pest_laravel: '^2.3'
            pest_arch: '^2.7'
            stability: prefer-stable
          - os: ubuntu-latest
            php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
            pest: '^3.0'
            pest_laravel: '^3.0'
            pest_arch: '^3.0'
            stability: prefer-lowest
          - os: windows-latest
            php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
            pest: '^3.0'
            pest_laravel: '^3.0'
            pest_arch: '^3.0'
            stability: prefer-stable
          - os: ubuntu-latest
            php: '8.4'
            laravel: '11.*'
            testbench: '9.*'
            pest: '^3.0'
            pest_laravel: '^3.0'
            pest_arch: '^3.0'
            stability: prefer-stable
          - os: ubuntu-latest
            php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            pest: '^4.0'
            pest_laravel: '^4.0'
            pest_arch: '^4.0'
            stability: prefer-stable
          - os: ubuntu-latest
            php: '8.5'
            laravel: '12.*'
            testbench: '10.*'
            pest: '^4.0'
            pest_laravel: '^4.0'
            pest_arch: '^4.0'
            stability: prefer-stable
          - os: windows-latest
            php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            pest: '^4.0'
            pest_laravel: '^4.0'
            pest_arch: '^4.0'
            stability: prefer-stable

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.stability }} / ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.pest_laravel }}" "pestphp/pest-plugin-arch:${{ matrix.pest_arch }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction -W
          composer dump-autoload

      - name: List installed dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci
